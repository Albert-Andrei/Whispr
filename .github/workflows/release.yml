name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch sidecar binaries
        run: ./scripts/fetch-sidecars.sh

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: false
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Whispr ${{ github.ref_name }}"
          releaseBody: ""
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          args: --target ${{ matrix.target }}
          updaterJsonPreferNsis: false

      # A copy of the DMG without the version in its name makes
      # https://github.com/Albert-Andrei/Whispr/releases/latest/download/Whispr_aarch64.dmg
      # a permanent link to the newest release (used by the GitHub Pages site).
      # Prereleases never become "latest", so beta tags don't change it.
      - name: Upload version-free DMG for the permanent download link
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)
          test -n "$DMG" || { echo "no DMG found"; exit 1; }
          cp "$DMG" Whispr_aarch64.dmg
          gh release upload "${{ github.ref_name }}" Whispr_aarch64.dmg --clobber

      - name: Verify bundled tools in Whispr.app
        run: |
          APP=src-tauri/target/${{ matrix.target }}/release/bundle/macos/Whispr.app
          ls -la "$APP/Contents/MacOS"
          for t in ffmpeg yt-dlp whisper-cli; do
            test -x "$APP/Contents/MacOS/$t" || { echo "missing sidecar: $t"; exit 1; }
          done
          "$APP/Contents/MacOS/ffmpeg" -version | head -1
          "$APP/Contents/MacOS/yt-dlp" --version
          "$APP/Contents/MacOS/whisper-cli" --help >/dev/null 2>&1 || test $? -le 1
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|flags' || true
